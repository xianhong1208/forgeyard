name: Publish images

# The server (forgeyard) and agent (forgeyard-agent) images, for linux/amd64 and linux/arm64, pushed
# to Docker Hub when a release tag vX.Y.Z is pushed, tagged X.Y.Z, X.Y and latest (a pre-release only
# X.Y.Z), with provenance and an SBOM. The amd64 images are then pulled back by digest and smoke-tested.
#
# Pushing needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN and the namespace in
# forgeyard/install/images.py. Without them (or run by hand on a branch) both images are still built
# and smoke-tested, nothing is pushed, and the run ends green with a notice saying why
# (scripts/publish_plan.py decides).

on:
  push:
    tags: ["v*"]
    branches: [docker-images]  # TEMPORARY: prove the workflow before it reaches main; removed again
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: What to publish
        id: plan
        env:
          HAVE_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          python3 scripts/publish_plan.py | tee -a "$GITHUB_OUTPUT"

      - name: Not pushing
        if: steps.plan.outputs.push != 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "::notice title=Images not pushed::$REASON"
          {
            echo "### Images not pushed"
            echo
            echo "$REASON. Both images are built for $PLATFORMS and the amd64 ones smoke-tested anyway."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push) the agent image
        id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          tags: ${{ steps.plan.outputs.agent_tags }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.title=Forgeyard agent
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish-agent
          cache-to: type=gha,scope=publish-agent,mode=max

      - name: Build (and push) the server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.server
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          tags: ${{ steps.plan.outputs.server_tags }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.title=Forgeyard
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish-server
          cache-to: type=gha,scope=publish-server,mode=max

      # ---------------------------------------------------------------- what to smoke-test
      - name: The pushed amd64 images, by digest
        id: pushed
        if: steps.plan.outputs.push == 'true'
        env:
          AGENT: ${{ steps.plan.outputs.agent_repository }}@${{ steps.agent.outputs.digest }}
          SERVER: ${{ steps.plan.outputs.server_repository }}@${{ steps.server.outputs.digest }}
        run: |
          # The amd64 manifest inside each multi-platform index (the attestations are "unknown/unknown").
          amd64() {
            docker buildx imagetools inspect --raw "$1" | python3 -c '
          import json, sys
          print(next(m["digest"] for m in json.load(sys.stdin)["manifests"]
                     if m.get("platform", {}).get("os") == "linux" and m["platform"].get("architecture") == "amd64"))'
          }
          agent="${AGENT%@*}@$(amd64 "$AGENT")"
          server="${SERVER%@*}@$(amd64 "$SERVER")"
          docker pull "$agent"
          docker pull "$server"
          { echo "agent=$agent"; echo "server=$server"; } >> "$GITHUB_OUTPUT"

      - name: Build the amd64 agent image locally (not pushed)
        if: steps.plan.outputs.push != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          load: true
          tags: forgeyard-agent:publish-check
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=publish-agent

      - name: Build the amd64 server image locally (not pushed)
        if: steps.plan.outputs.push != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          load: true
          tags: forgeyard:publish-check
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=publish-server

      # ---------------------------------------------------------------- smoke tests
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - name: Smoke test the agent image
        env:
          IMAGE: ${{ steps.pushed.outputs.agent || 'forgeyard-agent:publish-check' }}
        run: scripts/agent_image_smoke.sh "$IMAGE"
      - name: Smoke test the server image
        env:
          IMAGE: ${{ steps.pushed.outputs.server || 'forgeyard:publish-check' }}
        run: scripts/server_image_smoke.sh "$IMAGE"

      - name: Digests
        if: always() && steps.server.outcome == 'success' && steps.agent.outcome == 'success'
        env:
          PUSHED: ${{ steps.plan.outputs.push }}
          AGENT: ${{ steps.plan.outputs.agent_repository }}@${{ steps.agent.outputs.digest }}
          SERVER: ${{ steps.plan.outputs.server_repository }}@${{ steps.server.outputs.digest }}
          AGENT_TAGS: ${{ steps.plan.outputs.agent_tags }}
          SERVER_TAGS: ${{ steps.plan.outputs.server_tags }}
          AGENT_AMD64: ${{ steps.pushed.outputs.agent }}
          SERVER_AMD64: ${{ steps.pushed.outputs.server }}
        run: |
          {
            if [ "$PUSHED" = true ]; then echo "### Published images"; else echo "### Built images (not pushed)"; fi
            echo
            echo "| Image | Multi-platform digest | Tags |"
            echo "|---|---|---|"
            echo "| server | \`$SERVER\` | \`${SERVER_TAGS//,/\` \`}\` |"
            echo "| agent | \`$AGENT\` | \`${AGENT_TAGS//,/\` \`}\` |"
            if [ -n "$SERVER_AMD64" ]; then
              echo
              echo "Smoke-tested (linux/amd64): \`$SERVER_AMD64\`, \`$AGENT_AMD64\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
