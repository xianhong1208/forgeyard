name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Python comes from actions/setup-python and uv from PyPI: anonymous downloads of
# python-build-standalone and of the uv binary from GitHub releases kept failing with 504.
env:
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forgeyard
          POSTGRES_PASSWORD: forgeyard
          POSTGRES_DB: forgeyard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forgeyard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://forgeyard:forgeyard@127.0.0.1:5432/forgeyard_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - run: uv sync --locked --extra postgres
      - run: uv run --no-sync python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - name: shellcheck install.sh and the smoke test
        run: shellcheck -s sh forgeyard/install/install.sh && shellcheck scripts/agent_image_smoke.sh
      - name: Build the agent image
        run: docker build -f Dockerfile.agent -t forgeyard-agent:ci .
      - name: Smoke test (contents, simulation, a real join and a restart)
        run: scripts/agent_image_smoke.sh forgeyard-agent:ci
      - name: Image size
        run: docker image ls forgeyard-agent:ci

  # The server image (Dockerfile.server), built and started the way the guide says. Not pushed: releases
  # publish both images with publish-images.yml.
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: hadolint both Dockerfiles
        run: |
          for f in Dockerfile.server Dockerfile.agent; do
            echo "$f"
            docker run --rm -i "$HADOLINT" < "$f"
          done
        env:
          HADOLINT: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
      - name: shellcheck the smoke test
        run: shellcheck scripts/server_image_smoke.sh
      - name: Build the server image
        run: |
          docker build -f Dockerfile.server -t forgeyard:ci \
            --build-arg VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' forgeyard/__init__.py)" \
            --build-arg REVISION="$GITHUB_SHA" .
      - name: Smoke test (contents, first start and setup, HTTPS, health, a new container on the same volume)
        run: scripts/server_image_smoke.sh forgeyard:ci
      - name: Image size
        run: docker image ls forgeyard:ci

  # Both images build for linux/arm64 too (under QEMU; build only, no smoke test: emulated, it would
  # take long). The released images are built the same way by publish-images.yml.
  images-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the agent image for linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=agent-arm64
          cache-to: type=gha,scope=agent-arm64,mode=max
      - name: Build the server image for linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=server-arm64
          cache-to: type=gha,scope=server-arm64,mode=max
