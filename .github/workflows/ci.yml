name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Python comes from actions/setup-python and uv from PyPI: anonymous downloads of
# python-build-standalone and of the uv binary from GitHub releases kept failing with 504.
env:
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forgeyard
          POSTGRES_PASSWORD: forgeyard
          POSTGRES_DB: forgeyard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forgeyard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://forgeyard:forgeyard@127.0.0.1:5432/forgeyard_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - run: uv sync --locked --extra postgres
      - run: uv run --no-sync python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install uv
      - name: shellcheck install.sh and the smoke test
        run: shellcheck -s sh forgeyard/install/install.sh && shellcheck scripts/agent_image_smoke.sh
      - name: Build the agent image
        run: docker build -f Dockerfile.agent -t forgeyard-agent:ci .
      - name: Smoke test (contents, simulation, a real join and a restart)
        run: scripts/agent_image_smoke.sh forgeyard-agent:ci
      - name: Image size
        run: docker image ls forgeyard-agent:ci
