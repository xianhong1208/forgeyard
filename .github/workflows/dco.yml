name: DCO

# Every non-merge commit of a pull request must carry a "Signed-off-by:" line whose email is
# the commit's author email (Developer Certificate of Origin, see CONTRIBUTING.md#licence).
# Commits by bots (author name ending in "[bot]") are not checked.
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dco:
    # The release pull requests (dev → main, and main → dev after a release) are not checked again:
    # every commit reached dev through its own pull request, where this check ran, and dev takes no
    # direct pushes. Checking them would fail on commits merged before the DCO was adopted (#160).
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      !((github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main') ||
        (github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: shellcheck the check
        run: shellcheck scripts/check_dco.sh
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_dco.sh "$BASE" "$HEAD"
