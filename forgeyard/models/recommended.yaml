# Recommended models: the list shown on Models > Add a model, so nobody has to know repository names
# to get started. Edit it freely: tests/test_recommended.py checks its shape, and
# `python scripts/check_recommended.py` inspects every entry on Hugging Face with Forgeyard's own
# inspector and estimator (and prints the sizes to put here).
#
# Each entry is added like any other model: inspected on Hugging Face and pinned to the commit its
# revision (default: main) resolves to at that moment. Nothing here is pinned in advance.
#
#   name          the catalog name it is added as (a-z, 0-9, '.', '_', '-')
#   title         what people see
#   source        hf://<org>/<name>
#   revision      optional: a branch, tag or ref to resolve instead of main
#   file          GGUF only: which file of the repository
#   group         one of the groups below
#   task          chat | embed | rerank | asr
#   format        safetensors | gguf | ctranslate2 (what the repository holds)
#   recipe        the recipe suggested for it (it must serve that task and format)
#   device        optional: cpu to suggest running it on the CPU (the recipe must have a CPU variant)
#   download_gib  about how much a machine downloads
#   memory_gib    about what one replica reserves with the recipe's defaults (GPU memory, or RAM on
#                 the CPU), from Forgeyard's own estimate; the real estimate is shown when adding it
#   gated         true: Hugging Face only serves it with a token whose account accepted the licence
#   engine_args   optional: extra engine arguments per recipe, stored with the catalog entry
#   note          one line: what it is good for

groups:
  - id: qwen3
    title: Qwen3
    description: Open models from Alibaba's Qwen team in many sizes, with embedding and reranker models made to go with them.
  - id: llm
    title: Other open chat models
    description: Well-known open models from OpenAI, Google and Meta.
  - id: speech
    title: Speech to text
    description: Whisper models converted for faster-whisper, served through speaches.
  - id: retrieval
    title: Embeddings and rerank
    description: General-purpose models for search and retrieval (RAG), in over 100 languages.

models:
  # ---------------------------------------------------------------- Qwen3
  - name: qwen3-0.6b
    title: Qwen3 0.6B
    source: hf://Qwen/Qwen3-0.6B
    group: qwen3
    task: chat
    format: safetensors
    recipe: vllm
    download_gib: 1.4
    memory_gib: 7.3
    note: The smallest Qwen3 chat model. Quick to download, good for a first test.
  - name: qwen3-1.7b
    title: Qwen3 1.7B
    source: hf://Qwen/Qwen3-1.7B
    group: qwen3
    task: chat
    format: safetensors
    recipe: vllm
    download_gib: 3.8
    memory_gib: 9.7
    note: Small and fast; fine for simple chat, short summaries and classification.
  - name: qwen3-4b
    title: Qwen3 4B
    source: hf://Qwen/Qwen3-4B
    group: qwen3
    task: chat
    format: safetensors
    recipe: vllm
    download_gib: 7.5
    memory_gib: 14.4
    note: A good default for everyday chat on a single GPU.
  - name: qwen3-8b
    title: Qwen3 8B
    source: hf://Qwen/Qwen3-8B
    group: qwen3
    task: chat
    format: safetensors
    recipe: vllm
    download_gib: 15.3
    memory_gib: 22.2
    note: Noticeably better answers than 4B; needs a 24 GB card or larger.
  - name: qwen3-14b
    title: Qwen3 14B
    source: hf://Qwen/Qwen3-14B
    group: qwen3
    task: chat
    format: safetensors
    recipe: vllm
    download_gib: 27.5
    memory_gib: 34.9
    note: Strong general model for a 40 GB or larger card.
  - name: qwen3-32b
    title: Qwen3 32B
    source: hf://Qwen/Qwen3-32B
    group: qwen3
    task: chat
    format: safetensors
    recipe: vllm
    download_gib: 61.0
    memory_gib: 71.4
    note: The largest dense Qwen3; an 80 GB card, or split it over two GPUs when deploying.
  - name: qwen3-1.7b-gguf
    title: Qwen3 1.7B (GGUF, for the CPU)
    source: hf://ggml-org/Qwen3-1.7B-GGUF
    file: Qwen3-1.7B-Q4_K_M.gguf
    group: qwen3
    task: chat
    format: gguf
    recipe: llama-cpp
    device: cpu
    download_gib: 1.2
    memory_gib: 2.9
    note: Runs on a machine without a GPU with llama.cpp (4-bit). Slower, but needs only a few GB of RAM.
  - name: qwen3-8b-gguf
    title: Qwen3 8B (GGUF, for the CPU)
    source: hf://Qwen/Qwen3-8B-GGUF
    file: Qwen3-8B-Q4_K_M.gguf
    group: qwen3
    task: chat
    format: gguf
    recipe: llama-cpp
    device: cpu
    download_gib: 4.7
    memory_gib: 6.6
    note: A bigger CPU model (4-bit). Better answers than 1.7B, a few words per second on a desktop CPU.
  - name: qwen3-embedding-0.6b
    title: Qwen3 Embedding 0.6B
    source: hf://Qwen/Qwen3-Embedding-0.6B
    group: qwen3
    task: embed
    format: safetensors
    recipe: vllm-pooling
    download_gib: 1.1
    memory_gib: 3.4
    note: Turns text into vectors for search and RAG. Small; shares a GPU with other models.
  - name: qwen3-embedding-4b
    title: Qwen3 Embedding 4B
    source: hf://Qwen/Qwen3-Embedding-4B
    group: qwen3
    task: embed
    format: safetensors
    recipe: vllm-pooling
    download_gib: 7.5
    memory_gib: 10.0
    note: More accurate embeddings than 0.6B, at about three times the memory.
  - name: qwen3-reranker-0.6b
    title: Qwen3 Reranker 0.6B
    source: hf://Qwen/Qwen3-Reranker-0.6B
    group: qwen3
    task: rerank
    format: safetensors
    recipe: vllm-pooling
    download_gib: 1.1
    memory_gib: 3.4
    engine_args:
      vllm-pooling: ["--hf-overrides", '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}', "--chat-template", "${MODEL_PATH}/chat_template.jinja"]
    note: Re-orders search results by relevance to the question. Comes with the arguments vLLM needs for it.
  - name: qwen3-reranker-4b
    title: Qwen3 Reranker 4B
    source: hf://Qwen/Qwen3-Reranker-4B
    group: qwen3
    task: rerank
    format: safetensors
    recipe: vllm-pooling
    download_gib: 7.5
    memory_gib: 10.0
    engine_args:
      vllm-pooling: ["--hf-overrides", '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}', "--chat-template", "${MODEL_PATH}/chat_template.jinja"]
    note: A more accurate reranker than 0.6B. Comes with the arguments vLLM needs for it.

  # ---------------------------------------------------------------- other open chat models
  - name: gpt-oss-20b
    title: gpt-oss 20B
    source: hf://openai/gpt-oss-20b
    group: llm
    task: chat
    format: safetensors
    recipe: vllm
    download_gib: 12.8
    memory_gib: 16.7
    note: OpenAI's open-weight reasoning model (Apache 2.0); mixture of experts, quick for its size.
  - name: gemma-3-4b-it
    title: Gemma 3 4B
    source: hf://google/gemma-3-4b-it
    group: llm
    task: chat
    format: safetensors
    recipe: vllm
    gated: true
    download_gib: 8.0
    memory_gib: 14.7
    note: Google's small Gemma 3. Accept the Gemma licence on Hugging Face first.
  - name: gemma-3-12b-it
    title: Gemma 3 12B
    source: hf://google/gemma-3-12b-it
    group: llm
    task: chat
    format: safetensors
    recipe: vllm
    gated: true
    download_gib: 22.7
    memory_gib: 37.1
    note: Mid-size Gemma 3 for a 40 GB or larger card. Accept the Gemma licence on Hugging Face first.
  - name: gemma-3-27b-it
    title: Gemma 3 27B
    source: hf://google/gemma-3-27b-it
    group: llm
    task: chat
    format: safetensors
    recipe: vllm
    gated: true
    download_gib: 51.1
    memory_gib: 69.0
    note: The largest Gemma 3, for an 80 GB card. Accept the Gemma licence on Hugging Face first.
  - name: llama-3.2-3b-instruct
    title: Llama 3.2 3B Instruct
    source: hf://meta-llama/Llama-3.2-3B-Instruct
    group: llm
    task: chat
    format: safetensors
    recipe: vllm
    gated: true
    download_gib: 6.0
    memory_gib: 11.9
    note: Meta's small Llama. Request access to Llama 3.2 on Hugging Face first.
  - name: llama-3.1-8b-instruct
    title: Llama 3.1 8B Instruct
    source: hf://meta-llama/Llama-3.1-8B-Instruct
    group: llm
    task: chat
    format: safetensors
    recipe: vllm
    gated: true
    download_gib: 15.0
    memory_gib: 21.4
    note: Meta's widely used 8B model. Request access to Llama 3.1 on Hugging Face first.

  # ---------------------------------------------------------------- speech
  - name: faster-whisper-small
    title: Whisper small (faster-whisper)
    source: hf://Systran/faster-whisper-small
    group: speech
    task: asr
    format: ctranslate2
    recipe: faster-whisper
    download_gib: 0.5
    memory_gib: 1.8
    note: Fast transcription in about 100 languages; good enough for clear speech.
  - name: faster-whisper-large-v3-turbo
    title: Whisper large-v3 turbo (faster-whisper)
    source: hf://deepdml/faster-whisper-large-v3-turbo-ct2
    group: speech
    task: asr
    format: ctranslate2
    recipe: faster-whisper
    download_gib: 1.5
    memory_gib: 2.9
    note: Much more accurate than small, still quick. The usual choice for real transcription work.

  # ---------------------------------------------------------------- embeddings and rerank
  - name: bge-m3
    title: BGE-M3
    source: hf://BAAI/bge-m3
    # The repository's main branch has PyTorch weights only; this is Hugging Face's own conversion
    # of the same weights to safetensors (pull request 130 by its SFconvertbot).
    revision: refs/pr/130
    group: retrieval
    task: embed
    format: safetensors
    recipe: vllm-pooling
    download_gib: 2.1
    memory_gib: 4.3
    note: Widely used multilingual embedding model (8192 tokens). Uses Hugging Face's safetensors conversion of it.
  - name: bge-reranker-v2-m3
    title: BGE reranker v2 M3
    source: hf://BAAI/bge-reranker-v2-m3
    group: retrieval
    task: rerank
    format: safetensors
    recipe: vllm-pooling
    download_gib: 2.1
    memory_gib: 4.3
    note: Multilingual reranker that pairs with BGE-M3.
