# Recommended models: the list shown on Models > Add a model, so nobody has to know repository names
# to get started. Edit it freely: tests/test_recommended.py checks its shape, and
# `python scripts/check_recommended.py` inspects every entry on Hugging Face with Forgeyard's own
# inspector and estimator (and prints the sizes to put here).
#
# Each entry is added like any other model: inspected on Hugging Face and pinned to the commit its
# revision (default: main) resolves to at that moment. Nothing here is pinned in advance.
#
#   name          the catalog name it is added as (a-z, 0-9, '.', '_', '-')
#   title         what people see
#   source        hf://<org>/<name>
#   revision      optional: a branch, tag or ref to resolve instead of main; text-to-speech and image
#                 entries are pinned to a commit (their voices, files and measured memory belong to it)
#   file          GGUF (and image models' safetensors files) only: which file of the repository
#   group         one of the groups below
#   task          chat | embed | rerank | asr | tts | image
#   format        safetensors | gguf | ctranslate2 | onnx | diffusers (what the repository holds)
#   recipe        the recipe suggested for it (it must serve that task and format)
#   device        optional: cpu to suggest running it on the CPU (the recipe must have a CPU variant)
#   download_gib  about how much a machine downloads
#   memory_gib    about what one replica reserves with the recipe's defaults (GPU memory, or RAM on
#                 the CPU), from Forgeyard's own estimate; the real estimate is shown when adding it
#   gated         true: Hugging Face only serves it with a token whose account accepted the licence
#   license_from  optional: hf://<org>/<name> of the original model whose licence `license` is, for a
#                 conversion whose repository states none (GGUF, ONNX)
#   license       the licence Hugging Face shows for it (its id: apache-2.0, mit, gemma…). Only
#                 licences in forgeyard/models/recommended.py ALLOWED_LICENSES may be listed:
#                 permissive ones, OpenRAIL-style ones, and model licences that allow commercial use
#   inputs        what it takes in chat besides text: image, audio, video (shown on the list; the
#                 inspector reads the real answer from the model when it is added)
#   mmproj        GGUF vision models: the projector file of the repository to use with it (and for
#                 text-to-speech GGUFs, the audio decoder)
#   languages     tts: the languages it speaks (shown on the list)
#   components    image models for stable-diffusion.cpp: the files beside `file` (vae, llm, t5xxl, clip_l,
#                 clip_g); without it they are found by their names
#   engine_args   optional: extra engine arguments per recipe, stored with the catalog entry
#   note          one line: what it is good for

groups:
  - id: qwen3
    title: Qwen3
    description: Open models from Alibaba's Qwen team in many sizes, with embedding and reranker models made to go with them.
  - id: llm
    title: Other open chat models
    description: Well-known open models from OpenAI, Google (Gemma 4 needs no token, Gemma 3 does) and Meta.
  - id: vision
    title: Vision (images in chat)
    description: Chat models that also read images (and video, when enabled on the deployment). Qwen3-VL in three sizes for vLLM, and as GGUF with its projector for llama.cpp on the CPU or an AMD APU.
  - id: speech
    title: Speech to text
    description: Whisper models converted for faster-whisper, served through speaches.
  - id: tts
    title: Text to speech
    description: Built-in voices for /v1/audio/speech. Qwen3-TTS speaks Chinese (Mandarin and dialects), English and eight more languages on NVIDIA GPUs with vLLM-Omni, or as GGUF with llama.cpp on an AMD APU or the CPU; Kokoro and Chatterbox are small English voices that run on a CPU. No voice cloning.
  - id: images
    title: Images (text to image)
    description: Models for /v1/images/generations. Z-Image-Turbo, Stable Diffusion XL and FLUX.1-schnell on NVIDIA GPUs with vLLM-Omni; GGUF versions for stable-diffusion.cpp on an AMD GPU or APU (Vulkan), and Stable Diffusion 1.5 small enough for a CPU. Apache-2.0 and OpenRAIL licences only.
  - id: retrieval
    title: Embeddings and rerank
    description: General-purpose models for search and retrieval (RAG), in over 100 languages.

