# llama.cpp's llama-server for GGUF models: NVIDIA and AMD GPUs (ROCm or Vulkan) and plain CPUs, in
# a container or (CPU) as a process that needs no Docker.
#
# Pinned: build b12242 (2026-11-10). llama.cpp ships a build per merge rather than stable releases,
# and publishes images only for some builds, so the pin is one build for which the official images
# (ghcr.io/ggml-org/llama.cpp:server-*-b12242) and the release archives exist, so every variant runs
# the same code: https://github.com/ggml-org/llama.cpp/releases/tag/b12242. It is the first build
# with images after the OpenAI-compatible /v1/audio/speech endpoint was merged
# (ggml-org/llama.cpp#31763, in b12238), which text-to-speech uses. The CUDA image (`server-cuda`,
# the same digest as `server-cuda12`) is CUDA 12.8 (driver >= 570); the CPU process variant downloads the official Ubuntu x64 archive, checked
# against the SHA-256 GitHub publishes for it.
#
# AMD (.devops/rocm.Dockerfile and vulkan.Dockerfile at b12242), tried in this order:
# - rocm: the ROCm 7.2.1 image (7.7 GB compressed), built for gfx908, gfx90a, gfx942, gfx1030, gfx1100,
#   gfx1101, gfx1102, gfx1150, gfx1151, gfx1200 and gfx1201. It runs the Instinct cards (CDNA, which
#   have no Vulkan at all, MI300A included) and the discrete Radeon cards of that list. The APU
#   targets (gfx1150, gfx1151) are left out on purpose: they go to Vulkan.
# - vulkan: Mesa's RADV driver (Ubuntu 26.04 base, 0.3 GB compressed). Every other AMD GPU:
#   the APUs with unified memory (Strix Halo gfx1151, Strix Point gfx1150, Phoenix gfx1103 and the
#   rest), where Vulkan is the path checked on real hardware and needs no ROCm in the image, and
#   discrete cards the ROCm image was not built for (gfx1031, gfx1032 and other RDNA2 cards). It
#   needs only the card's render node: amd_kfd: false leaves /dev/kfd (ROCm's compute interface)
#   out of the container. Its memory is checked against the same pool the inventory reports for
#   the card: for an APU the larger of the BIOS carve-out and GTT.
# A machine never chooses: the first variant whose `when` matches a card is used. To run a card on
# the other one, add a custom recipe with only the variant you want.
#
# --fit off and explicit -c / -ngl keep its memory where the estimate puts it: by default
# llama-server grows its context to fill whatever is free, which on a shared card is someone
# else's memory.
#
# Images, audio and video in chat (1.3; tools/server/server-common.cpp, the same at b11977 and
# b12242): a GGUF vision model comes with a projector file (mmproj-*.gguf) in its catalog entry,
# passed as --mmproj. Video is decoded with ffmpeg (in the official images). llama-server downloads any http(s) URL in a media
# part with no host check and has no flag to turn that off, so the gateway fetches URLs itself and
# sends only data: URIs and base64 (and the agent's key guard lets only the gateway reach it);
# --media-path is never set, so file:// is refused. --image-max-tokens caps what one image takes: by
# default Qwen3-VL lets a 5 MB photo become ~4,000 tokens (measured: 125 s on 8 CPU threads, and it
# nearly filled a 4,096-token context), so images are scaled to at most image_tokens (1,024).
# Video: since ggml-org/llama.cpp#31619 (2026-11-03, tools/mtmd/mtmd-helper.cpp) a model with its own
# video template (Qwen3-VL, LFM3) is sampled at its reference rate and frame size (Qwen3-VL: 2 frames
# a second, in pairs, with timestamps) and --video-fps applies only to other models. The 6-second
# sample clip on Qwen3-VL 2B: 3,565 prompt tokens on b11977 (1 frame a second), 5,345 on b12242.
name: llama-cpp
title: llama.cpp
description: >-
  GGUF (quantised) models with llama-server: on NVIDIA GPUs, AMD GPUs (ROCm, or Vulkan for APUs and
  other cards) in a container, or on the CPU in a container or as a plain process. OpenAI-compatible
  API.
engine: llama.cpp
version: b12242
tasks: [chat]
formats: [gguf]
api: {chat: openai-chat}
upstream_model: served_name
share: exclusive
port: 8080
health: {path: /health, start_period: 600, interval: 5, timeout: 5, failure_threshold: 3}
estimate:
  method: gguf
  kv_sequences: concurrency
  # Compute buffers beyond the logits buffer that is counted from the vocabulary. CPU: measured on
  # Qwen3-1.7B Q4_K_M, 4096 x 2 context, 8 threads: RSS 2.77 GiB = weights 1.19 + KV 0.88 + logits
  # 0.29 + 0.42 GiB of other buffers (measured on real hardware).
  overhead: 512MiB
  cpu_overhead: 512MiB
  # With a projector: its file is counted as it is, plus its compute buffers (measured on the CPU
  # with Qwen3-VL-2B, see CHANGELOG 1.3).
  vision_overhead: 512MiB
  # With video on (videos >= 1): the frames' buffers. Measured on the CPU with Qwen3-VL 2B at a
  # context of 8,192 and the 6-second sample clip: peak RSS 4.24 GiB on b12242 (4.15 on b11977)
  # against 3.83 GiB for the same run without video and an estimate of 3.95 GiB without this term.
  video_overhead: 512MiB
params:
  context: {type: int, default: 4096, min: 256, max: 1048576, label: Context length (tokens),
            help: Per request. llama-server gets context x concurrency in one shared KV cache.}
  concurrency: {type: int, default: 2, min: 1, max: 64, label: Concurrent requests}
  gpu_layers: {type: int, default: 999, min: 0, max: 999, label: Layers on the GPU,
               help: 999 = all. Ignored on the CPU.}
  threads: {type: int, default: 8, min: 1, max: 1024, label: CPU threads,
            help: "The cores it reserves on the CPU (counted for placement). Every core of a busy machine
              makes llama.cpp slower, not faster."}
  images: {type: int, default: 4, min: 0, max: 64, advanced: true, label: Images per request,
           help: "For models with a projector: the most images (and audio clips) one request may carry. 0 turns
             them off."}
  image_tokens: {type: int, default: 1024, min: 64, max: 16384, advanced: true, label: Largest image (tokens),
                 help: "Each image is scaled down to at most this many tokens (about 1024 x 1024 pixels at the default for
                   Qwen3-VL). Larger images read small text better but take more context, memory and time."}
  videos: {type: int, default: 0, min: 0, max: 8, advanced: true, label: Videos per request,
           help: "For models with a vision projector. Off (0) by default; each video is decoded into many frames."}
  video_fps: {type: float, default: 1.0, min: 0.1, max: 8.0, advanced: true, label: Video frames per second,
              help: "Frames read from each second of a video, for models without their own rate (Qwen3-VL reads 2 a
                second whatever this says: a 6-second clip took 5,345 tokens). Each frame costs about as much as an
                image; give video a context of 8,192 or more."}
  max_body_mb: {type: int, default: 64, min: 1, max: 1024, advanced: true, label: Largest request (MiB),
                help: "Requests larger than this are refused by the gateway (413). Images are sent as base64,
                  a third larger than the files."}
args: [-m, "{model_file}", --alias, "{served_name}", --host, "{host}", --port, "{port}",
       -c, "{kv_tokens}", -np, "{concurrency}", --kv-unified, -ngl, "{gpu_layers}", --fit, "off",
       -t, "{threads}", --no-webui]
optional_args:
  - if_model: mmproj
    args: [--mmproj, "{mmproj_file}", --image-max-tokens, "{image_tokens}", --video-fps, "{video_fps}"]
media: {inputs: [image, audio, video], files: false}
# The replica's internal key (M4). llama-server (b11977 to b12242) reads --api-key from LLAMA_API_KEY
# (common/arg.cpp: .set_env("LLAMA_API_KEY")) and then answers 401 to every path except /health,
# /v1/health and the web UI's files (tools/server/server-http.cpp: get_public_endpoints).
api_key_env: LLAMA_API_KEY
variants:
  - name: cuda
    when: {vendor: nvidia, compute_capability: ">=5.0", driver: ">=570"}
    runtime: container
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12242@sha256:a361e47e28e8801e290f3c855292e0f25047e5d8e998b0d101431f54db68e008
  - name: rocm
    when: {vendor: amd, arch: [gfx908, gfx90a, gfx942, gfx1030, gfx1100, gfx1101, gfx1102, gfx1200, gfx1201]}
    runtime: container
    image: ghcr.io/ggml-org/llama.cpp:server-rocm-b12242@sha256:69b0ab208a2e17294195132ab6c75eb6e9d1828c0b87409891aff86b9726cdfd
  - name: vulkan
    when: {vendor: amd}
    runtime: container
    amd_kfd: false
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12242@sha256:28a56d03c5cc4abeb16b2a5422c5286d9e48020a3cb3416434bff5fbf847bfa6
  - name: cpu
    when: {vendor: cpu, arch: [x86_64, aarch64]}
    runtime: container
    image: ghcr.io/ggml-org/llama.cpp:server-b12242@sha256:4d2de15a0ffbce704777c64026b40512a71e0bbc0b303a5fe5ea9bf71760dff9
  - name: cpu-process
    when: {vendor: cpu, arch: [x86_64]}
    runtime: process
    engine:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b12242/llama-b12242-bin-ubuntu-x64.tar.gz
      sha256: 909eef25cd53e6601c8a07c866d8dbb2983e74177088d55182137a8fb8255d62
      binary: llama-b12242/llama-server
