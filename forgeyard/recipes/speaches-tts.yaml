# Text to speech with Kokoro-82M and Piper voices (ONNX), served by speaches, an OpenAI-compatible
# server (POST /v1/audio/speech): https://github.com/speaches-ai/speaches
#
# Pinned: speaches 0.8.3, the same images as the faster-whisper recipe (one image on the machines
# for speech in both directions). speaches finds a TTS model in the Hugging Face cache like a Whisper
# one (models--<org>--<name>, the layout of Forgeyard's model cache) and decides how to run it from
# the cached README.md's card metadata (library onnx + tags speaches, kokoro: Kokoro; library piper:
# Piper), so the README is part of what is downloaded. It expects the Hugging Face id in a request's
# `model` field, hence upstream_model: repo.
#
# Its answers (src/speaches/routers/speech.py at v0.8.3): mp3, flac, wav and pcm (opus and aac are
# refused with 422); pcm and mp3 stream as sentences are made, flac and wav come whole. pcm is 16-bit
# mono at 24 kHz for Kokoro and at the voice's own rate for Piper (read from its config.json when it
# is added to the catalog). It has no SSE. `voice` is required: Kokoro's 54 voices (af_heart, am_adam,
# …) are listed by GET /v1/audio/voices; OpenAI voice names would be mapped to af_heart by speaches, the
# gateway does that itself (and says so).
#
# English only: every released speaches version deletes characters from U+24C2 to U+1F251 before
# speaking (text_utils.strip_emojis), which covers Chinese, Japanese and Korean (fixed on its main
# branch by speaches#610, not released). Such input is refused at the gateway (tts.cjk: false)
# rather than answered with silence; Qwen3-TTS (vllm-omni-tts, llama-cpp) speaks those languages.
# Piper itself is GPL-3.0 from piper-tts 1.3; speaches 0.8.3 ships the MIT-licensed 1.2.
name: speaches-tts
title: speaches (Kokoro, Piper)
description: >-
  Small English voices (Kokoro-82M, Piper) behind an OpenAI-compatible /v1/audio/speech; fast enough
  on a CPU, and shares a GPU by default. English (and other Latin-script) text only.
engine: speaches
version: "0.8.3"
tasks: [tts]
formats: [onnx]
api: {tts: openai-speech}
upstream_model: repo
share: vram
port: 8000
health: {path: /health, start_period: 300, interval: 10, timeout: 5, failure_threshold: 3}
estimate:
  # The model files plus ONNX Runtime's arena and the speaches process (Python, FastAPI): measured
  # for faster-whisper with the same image (0.98 GiB beyond the model); the GPU figure awaits the
  # real host.
  method: files
  overhead: 1GiB
  cpu_overhead: 1GiB
params:
  max_input_chars: {type: int, default: 4096, min: 1, max: 100000, advanced: true, label: Longest input (characters),
                    help: "Requests with more text are refused by the gateway (400 input_too_long). 4,096 is OpenAI's own
                      limit."}
tts:
  formats: [mp3, flac, wav, pcm]
  default_format: mp3
  stream_formats: [audio]
  voices: /v1/audio/voices
  default_voice: af_heart
  cjk: false
  pcm_rate: 24000
env:
  HF_HUB_OFFLINE: "1"
  HF_HUB_CACHE: "{model_hub}"
  UVICORN_HOST: "{host}"
  UVICORN_PORT: "{port}"
  ENABLE_UI: "false"
  # speaches 0.8.3 reads the TTS models' time-to-live from the Whisper setting (dependencies.py):
  # -1 keeps the voice loaded.
  WHISPER__TTL: "-1"
  LOG_LEVEL: info
  DO_NOT_TRACK: "1"
# The replica's internal key: as in the faster-whisper recipe (API_KEY; /health needs it too).
api_key_env: API_KEY
variants:
  - name: cuda
    when: {vendor: nvidia, compute_capability: ">=5.0", driver: ">=575"}
    runtime: container
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda@sha256:9abc6968a883e77ead9286c38a6ccf3139dcad518b783deeebb7be2ced50e972
  - name: cuda-12.4
    when: {vendor: nvidia, compute_capability: ">=5.0", driver: ">=550"}
    runtime: container
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.4.1@sha256:6a64b1dfe7fe650c72ff01027048858d51c5851993d0f76ba6046f4ca94545c7
  - name: cpu
    when: {vendor: cpu, arch: [x86_64, aarch64]}
    runtime: container
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
