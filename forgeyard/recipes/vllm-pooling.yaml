# Embedding and rerank models on vLLM's pooling runner: the same pinned image as the vllm recipe
# (one image to pull for three kinds of model), with defaults for small models that share a card.
#
# The KV cache only has to hold one full-length sequence (pooling requests are a single forward
# pass), so the estimate counts one sequence, not `concurrency` of them. Model-specific flags
# (for example Qwen3-Reranker's --hf-overrides, which turns the original checkpoint into a
# sequence classifier) are set on the catalog entry, not here.
#
# Embeddings: POST /v1/embeddings. Rerank: POST /v1/rerank (Jina/Cohere shape) and /score.
name: vllm-pooling
title: vLLM embeddings and rerank
description: >-
  Embedding and reranker models on vLLM's pooling runner. Small enough to share one GPU: each
  replica reserves its estimate and vLLM is held to it.
engine: vllm
version: "0.32.0"
tasks: [embed, rerank]
formats: [safetensors]
api: {embed: openai-embeddings, rerank: rerank}
upstream_model: served_name
share: vram
port: 8000
health: {path: /health, start_period: 900, interval: 10, timeout: 5, failure_threshold: 3}
estimate:
  method: safetensors-kv
  kv_sequences: one
  overhead: 1GiB
params:
  context: {type: int, default: 8192, min: 256, max: 131072, label: Max input length (tokens)}
  concurrency: {type: int, default: 32, min: 1, max: 1024, label: Inputs per batch}
  dtype: {type: choice, default: auto, choices: [auto, bfloat16, float16], label: Weights dtype}
args: ["{model_path}", --runner, pooling, --served-model-name, "{served_name}", --host, "{host}", --port, "{port}",
       --max-model-len, "{context}", --max-num-seqs, "{concurrency}",
       --gpu-memory-utilization, "{gpu_util}", --tensor-parallel-size, "{gpus}", --dtype, "{dtype}",
       --allowed-media-domains, forgeyard.invalid]
# The engine never fetches a URL itself (1.3): vLLM's pooling endpoints also read image URLs, and
# a non-empty --allowed-media-domains that matches nothing (.invalid never resolves) refuses them;
# redirects are off too. See the vllm recipe.
env:
  VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
  HF_HUB_OFFLINE: "1"
  HF_HUB_CACHE: "{model_hub}"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"
# The replica's internal key (M4): VLLM_API_KEY, as in the vllm recipe. Note that vLLM guards only
# /v1, /v2, /inference and /cohere: /rerank, /score and /pooling without the /v1 prefix stay open
# on the replica's own port (the agent's key guard covers them).
api_key_env: VLLM_API_KEY
variants:
  - name: cuda
    when: {vendor: nvidia, compute_capability: ">=7.0", driver: ">=580"}
    runtime: container
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    entrypoint: [vllm, serve]
  - name: cuda-12.9
    when: {vendor: nvidia, compute_capability: ">=7.0", driver: ">=575"}
    runtime: container
    image: vllm/vllm-openai:v0.32.0-cu129@sha256:bc0445dac61accbf1c3b17fbb524a71eee0b1b32f55ba45952095e3be8991c3f
    entrypoint: [vllm, serve]
  - name: rocm
    when: {vendor: amd, arch: [gfx90a, gfx942, gfx950, gfx1100, gfx1101, gfx1150, gfx1151, gfx1200, gfx1201]}
    runtime: container
    image: vllm/vllm-openai-rocm:v0.32.0@sha256:14f6a575e1fb0a580b0f633c09e06f648709d60405b85f6a7ff3f80d49f39905
    entrypoint: [vllm, serve]
