# Object detection, segmentation and depth (1.4) with Forgeyard's own vision server (images/vision):
# transformers models from the machine's model cache, answered by the gateway at /v1/vision/detect,
# /v1/vision/segment and /v1/vision/depth (forgeyard/models/vision.py says which models are which).
#
# The image is Forgeyard's own, published with every release as docker.io/<namespace>/forgeyard-vision
# (X.Y.Z for the CPU, linux/amd64 and arm64; X.Y.Z-cuda for NVIDIA, torch +cu130, driver 580 or newer),
# so it is named by the server's own version (`forgeyard_image`), not pinned by digest: it is built from
# the same commit as the server and agent that run it. On a machine without the network, load it with
# `docker load` under that tag; a tag-only image that is there is used without a pull. AMD GPUs have no
# build of their own yet: on an AMD machine these models run on its CPU.
#
# The model comes from the model cache like every other model ({model_path}, mounted read-only); the
# models the image bakes in are for the 1.3 workload templates only. One image at a time per replica (the
# server works on one and queues the rest); more throughput is more replicas. Memory, measured on a CPU
# with transformers 5.23 after three 640x480 requests (peak RSS): RT-DETRv2 r18 0.66 GiB (0.08 GiB of
# weights), SAM 2.1 tiny 1.12 GiB (0.15), Depth Anything V2 Small 0.85 GiB (0.10): the weights plus at
# most about 1 GiB, hence cpu_overhead. On a GPU the activations of one image are well under 1 GiB.
name: vision
title: Forgeyard vision server
description: >-
  Object detection, segmentation (SAM 2) and depth estimation with transformers models, behind
  /v1/vision/detect, /v1/vision/segment and /v1/vision/depth. Small: shares a GPU by default, and
  runs well on a CPU.
engine: forgeyard-vision
version: "1.4"
tasks: [detect, segment, depth]
formats: [safetensors]
api: {detect: vision-detect, segment: vision-segment, depth: vision-depth}
upstream_model: served_name
share: vram
port: 8000
health: {path: /health, start_period: 300, interval: 5, timeout: 5, failure_threshold: 3}
estimate:
  method: files
  overhead: 1GiB
  cpu_overhead: 1280MiB
params:
  threads: {type: int, default: 4, min: 1, max: 256, label: CPU threads,
            help: "Threads torch uses on a CPU (counted against the machine's threads). Ignored on a GPU.",
            advanced: true}
args: [--task, "{task}", --model, "{model_path}", --served-name, "{served_name}", --host, "{host}", --port, "{port}"]
env:
  HF_HUB_OFFLINE: "1"
  VISION_THREADS: "{threads}"
  DO_NOT_TRACK: "1"
# The replica's internal key: the vision server asks for it on every path but /health (1.4).
api_key_env: VISION_API_KEY
variants:
  - name: cuda
    # torch +cu130: CUDA 13 runs on Turing (7.5) and newer, with driver 580 or newer.
    when: {vendor: nvidia, compute_capability: ">=7.5", driver: ">=580"}
    runtime: container
    forgeyard_image: vision-cuda
  - name: cpu
    when: {vendor: cpu, arch: [x86_64, aarch64]}
    runtime: container
    forgeyard_image: vision
