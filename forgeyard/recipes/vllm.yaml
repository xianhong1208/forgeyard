# vLLM for chat and completion models (safetensors checkpoints), from the official images.
#
# Pinned: vLLM 0.32.0 (2026-10-18). Its default image is built on CUDA 13.0 and needs an NVIDIA
# driver >= 580; the -cu129 image runs on drivers from 575 (release notes:
# https://github.com/vllm-project/vllm/releases/tag/v0.32.0). 0.32 serves Qwen3 and the pooling
# runner (embeddings, rerank) used by the vllm-pooling recipe, so one image covers three of the
# four model kinds. AMD: the official ROCm image of the same release, built for gfx90a, gfx942,
# gfx950, gfx1100, gfx1101, gfx1150, gfx1151, gfx1200 and gfx1201 (docker/Dockerfile.rocm_base).
#
# --gpu-memory-utilization is a fraction of the card's TOTAL memory, and vLLM refuses to start
# unless that much is free (vllm/v1/worker/utils.py: request_memory). On a card shared with other
# people's work a fixed 0.9 would never start, so Forgeyard computes {gpu_util} from this
# replica's reservation: (reservation - CUDA context) / total, rounded down.
name: vllm
title: vLLM
description: >-
  Chat and completion models from Hugging Face safetensors checkpoints on NVIDIA or AMD GPUs,
  with an OpenAI-compatible API. Memory is reserved from the estimate and enforced through
  --gpu-memory-utilization.
engine: vllm
version: "0.32.0"
tasks: [chat]
formats: [safetensors]
api: {chat: openai-chat}
upstream_model: served_name
share: exclusive
port: 8000
health: {path: /health, start_period: 1200, interval: 10, timeout: 5, failure_threshold: 3}
estimate:
  method: safetensors-kv
  kv_sequences: concurrency
  # Activations of the profiling run, CUDA graphs, sampler and workspaces (on top of weights,
  # KV cache and the CUDA context). Calibrated on real hardware: see docs/acceptance-m3.md.
  overhead: 2GiB
params:
  context: {type: int, default: 8192, min: 256, max: 1048576, label: Context length (tokens),
            help: The longest request (prompt + output) it accepts.}
  concurrency: {type: int, default: 4, min: 1, max: 1024, label: Concurrent requests,
                help: Sequences served at once; the KV cache is sized for this many full-length ones.}
  dtype: {type: choice, default: auto, choices: [auto, bfloat16, float16], label: Weights dtype}
  quantization: {type: choice, default: none, choices: [none, fp8], label: Quantisation,
                 help: fp8 halves the linear layers' weights on the fly (Ampere and newer).}
args: ["{model_path}", --served-model-name, "{served_name}", --host, "{host}", --port, "{port}",
       --max-model-len, "{context}", --max-num-seqs, "{concurrency}",
       --gpu-memory-utilization, "{gpu_util}", --tensor-parallel-size, "{gpus}", --dtype, "{dtype}"]
optional_args:
  - if: {quantization: fp8}
    args: [--quantization, fp8]
env:
  HF_HUB_OFFLINE: "1"
  HF_HUB_CACHE: "{model_hub}"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"
# The replica's internal key (M4). vLLM 0.32.0 reads VLLM_API_KEY (vllm/envs.py) when --api-key is not
# given (vllm/entrypoints/serve/middleware/register.py) and then requires `Authorization: Bearer` on
# paths under /v1, /v2, /inference and /cohere (serve/middleware/authenticate.py: GUARDED_PREFIX).
# /health stays open, so the health check needs no key. Other paths (/invocations, /tokenize,
# /pooling, /score, /rerank without /v1) are not guarded by vLLM: see docs/acceptance-m4.md.
api_key_env: VLLM_API_KEY
variants:
  - name: cuda
    when: {vendor: nvidia, compute_capability: ">=7.0", driver: ">=580"}
    runtime: container
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    entrypoint: [vllm, serve]
  - name: cuda-12.9
    when: {vendor: nvidia, compute_capability: ">=7.0", driver: ">=575"}
    runtime: container
    image: vllm/vllm-openai:v0.32.0-cu129@sha256:bc0445dac61accbf1c3b17fbb524a71eee0b1b32f55ba45952095e3be8991c3f
    entrypoint: [vllm, serve]
  - name: rocm
    when: {vendor: amd, arch: [gfx90a, gfx942, gfx950, gfx1100, gfx1101, gfx1150, gfx1151, gfx1200, gfx1201]}
    runtime: container
    image: vllm/vllm-openai-rocm:v0.32.0@sha256:14f6a575e1fb0a580b0f633c09e06f648709d60405b85f6a7ff3f80d49f39905
    entrypoint: [vllm, serve]
