[project]
name = "forgeyard"
version = "1.1.1"
description = "Forgeyard: one control plane for the GPUs (and CPUs) you own: run any workload, deploy models, serve them behind one API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "argon2-cffi>=25.1",
    # The agent's connection to the server (uvicorn[standard] also uses it on the server side).
    "websockets>=15",
    # Engine recipes (M3). Already installed through uvicorn[standard]; listed because it is used.
    "pyyaml>=6",
    # The gateway's client to the replicas (M4): async, streaming. Was a dev dependency (tests).
    "httpx>=0.28",
    # The agent's key guard in front of model replicas: HTTP/1.1 parsing for its reverse proxy.
    # Already installed through httpx (httpcore) and uvicorn; listed because it is used.
    "h11>=0.16",
    "cryptography>=46",
    # The user guide at /guide: its Markdown rendered on the server (no raw HTML, works offline).
    "markdown-it-py>=4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Agent on NVIDIA machines: NVML bindings (read-only; no CUDA context, no GPU memory).
# AMD machines use the amdsmi library that ships with ROCm (see docs/acceptance-m1.md).
nvidia = ["nvidia-ml-py>=12.535"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    # The official OpenAI SDK, to test the gateway the way its users call it (M4).
    "openai>=2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["web", "forgeyard/static"]

[tool.ruff.lint]
# Correctness rules, the same baseline as Tony's other projects.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
