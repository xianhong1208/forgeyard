[project]
name = "forgeyard"
version = "1.6.0"
description = "Forgeyard: one control plane for the GPUs (and CPUs) you own: run any workload, deploy models, serve them behind one API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "argon2-cffi>=25.1",
    # The agent's connection to the server (uvicorn[standard] also uses it on the server side).
    "websockets>=15",
    # Engine recipes (M3). Already installed through uvicorn[standard]; listed because it is used.
    "pyyaml>=6",
    # The gateway's client to the replicas (M4): async, streaming. Was a dev dependency (tests).
    "httpx>=0.28",
    # The agent's key guard in front of model replicas: HTTP/1.1 parsing for its reverse proxy.
    # Already installed through httpx (httpcore) and uvicorn; listed because it is used.
    "h11>=0.16",
    "cryptography>=46",
    # The user guide at /guide: its Markdown rendered on the server (no raw HTML, works offline).
    "markdown-it-py>=4",
    # GET /metrics in the Prometheus text format (1.4.5, #165). Apache-2.0, no dependencies of its own.
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# The server's own extras (1.5.2, #95): verifying upstream signatures (GitHub artifact attestations, Sigstore bundles)
# when an admin tries a newer engine version. The server image, the install docs and development install it
# (`uv sync --extra server`); the agent never imports it (it runs the digest the server verified) and its wheel and
# image do not carry it. Without it, a signed engine's version cannot be verified (Try says so). Apache-2.0,
# maintained by the Sigstore project (OpenSSF).
# Single sign-on through an OpenID Connect provider (1.6.0, #39): Authlib (BSD-3) for the authorization-code exchange
# with PKCE, and joserfc (BSD-3, Authlib's own JOSE library, installed with it) to check the ID token's signature.
# Imported only when an identity provider is used; without them the console says single sign-on is unavailable.
server = ["sigstore>=4.6,<5", "authlib>=1.9.10,<1.10", "joserfc>=1.6.8"]
# Agent on NVIDIA machines: NVML bindings (read-only; no CUDA context, no GPU memory).
# AMD machines use the amdsmi library that ships with ROCm.
nvidia = ["nvidia-ml-py>=12.535"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-timeout>=2.3",
    "ruff>=0.12",
    # The official OpenAI SDK, to test the gateway the way its users call it (M4).
    "openai>=2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["web", "forgeyard/static"]

[tool.ruff.lint]
# Correctness rules on top of ruff's defaults.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that hangs fails after 5 minutes and prints every thread's stack, instead of holding CI until
# GitHub's 6-hour limit with nothing to show for it.
timeout = 300
timeout_method = "thread"
